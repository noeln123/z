{% extends "base.html" %}

{% block content %}
<h2>Driver Management</h2>
<a href="{{ url_for('admin.add_driver') }}">Add New Driver</a>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact Information</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for driver in drivers %}
            <tr>
                <td>{{ driver.id }}</td>
                <td>{{ driver.name }}</td>
                <td>{{ driver.contact_info }}</td>
                <td>{{ driver.location }}</td>
                <td>
                    <a href="{{ url_for('admin.edit_driver', driver_id=driver.id) }}">Edit</a>
                    <form action="{{ url_for('admin.delete_driver', driver_id=driver.id) }}" method="POST" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this driver?');">Delete</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
